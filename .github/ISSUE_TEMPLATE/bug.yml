name: 问题反馈
description: 功能异常、闪退或和预期不符
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        反馈Eta的问题。提交前请先搜一下有没有类似 Issue。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望怎样，实际怎样。
      placeholder: 例如：点发送后一直转圈，过一会儿闪退。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 怎么复现
      description: 尽量写成步骤。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置 → 关于里的版本号，或 APK 文件名，例如 5.2.8。
      placeholder: 5.2.8
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 机型、Android / ColorOS / HyperOS 版本。有 Root 或 LSPosed 也可以写上。
      placeholder: 例如 OnePlus 12 · ColorOS 15 · 已 Root
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 其他
      description: 日志、截图、录屏都可以贴。设置里可导出诊断日志。
    validations:
      required: false
