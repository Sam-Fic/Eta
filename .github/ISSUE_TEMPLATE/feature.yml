name: 功能建议
description: 想要的新能力或现有体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说明想解决什么问题，以及希望Eta怎么做。
  - type: textarea
    id: problem
    attributes:
      label: 现在缺什么
      placeholder: 例如：备份还原后 Linux 环境要重新装一遍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样
      placeholder: 例如：导入完整备份后直接识别已安装的 Debian。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他
      description: 参考截图、其他 App 的做法都可以。
    validations:
      required: false
